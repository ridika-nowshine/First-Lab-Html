<!DOCTYPE html>
<html>
<head>
    <title>TechFlow - Register</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
        }

        .left{
            width:18%;
            background:black;
            color:white;
            padding:30px 20px;
            display:flex;
            flex-direction:column;
        }

        .logo{
            font-size:22px;
            font-weight:bold;
            margin-bottom:40px;
        }

        .menu{
            display:flex;
            flex-direction:column;
            gap:20px;
        }

        .menu a{
            color:white;
            text-decoration:none;
            font-size:16px;
        }

        .menu a:hover{
            color:#28a745;
        }
       
        .right{
            width:82%;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f2f4f8;
        }

        .form-box{
            width:350px;
            background:white;
            padding:40px;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
            border-radius:8px;
        }

        .form-box h2{
            text-align:center;
            margin-bottom:20px;
        }

        .form-box input,
        .form-box select{
            width:100%;
            padding:10px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;
        }

        .register-btn{
            width:100%;
            padding:10px;
            margin-top:10px;
            background:#28a745;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .register-btn:hover{
            background:#1e7e34;
        }

    </style>
</head>
<body>

<div class="left">
    <div class="logo">TechFlow</div>

    <div class="menu">
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </div>
</div>

<div class="right">
    <div class="form-box">
        <h2>Create Account</h2>

        <input type="email" placeholder="Email Address" required>
        <input type="password" placeholder="Password" required>

        <select required>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <button class="register-btn">
            Register
        </button>
    </div>
</div>

</body>
</html>
